<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>廠商訂單追蹤系統 V2.26</title>
  <style>
    body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f5f7fa;color:#101828;display:grid;place-items:center;min-height:100vh}
    .boot{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:26px 30px;box-shadow:0 10px 30px #10182814;text-align:center;min-width:280px}
    .boot strong{display:block;font-size:22px;margin-bottom:8px}.boot span{color:#667085;font-size:14px}
  </style>
</head>
<body>
  <div class="boot"><strong>系統 V2.26 載入中…</strong><span id="bootMsg">正在取得穩定版程式</span></div>
  <script>
  (async()=>{
    const msg=document.getElementById('bootMsg');
    const stamp='226';
    const sources=[
      'https://raw.githubusercontent.com/jacky0530-spec/vendor-order-tracking/main/index.html?build='+stamp+'&t='+Date.now(),
      './index.html?build='+stamp+'&t='+Date.now()
    ];
    let html='';
    let lastErr=null;
    for(const url of sources){
      try{
        const r=await fetch(url,{cache:'no-store',headers:{'Cache-Control':'no-cache'}});
        if(!r.ok) throw new Error('HTTP '+r.status);
        html=await r.text();
        if(html.includes('id="loginBtn"')) break;
        html='';
      }catch(e){lastErr=e;}
    }
    if(!html) throw lastErr||new Error('無法取得最新版頁面');

    html=html.replace(/(\.css|\.js)\?[^"']+/g,'$1?build='+stamp);
    html=html.replace('./login-fix.js?build='+stamp,'./login-fix-2252.js?build='+stamp);
    html=html.replace('./version-authority.js?build='+stamp,'./version-authority-2252.js?build='+stamp);
    html=html.replace(/Vendor Order Tracking V2\.\d+/g,'Vendor Order Tracking V2.26');

    document.open();
    document.write(html);
    document.close();
  })().catch(err=>{
    const msg=document.getElementById('bootMsg');
    if(msg) msg.textContent='載入失敗：'+(err?.message||err)+'，請重新整理一次。';
  });
  </script>
</body>
</html>
